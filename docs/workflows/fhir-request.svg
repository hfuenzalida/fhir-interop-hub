<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-label="FHIR hub request flow">
  <defs>
    <marker id="fh" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .b { fill: #fff; stroke: #64748b; }
      .hi { fill: #ecfdf5; stroke: #059669; }
      .t { font: 600 14px system-ui,sans-serif; fill: #0f172a; }
      .l { font: 12px system-ui,sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect width="880" height="340" fill="#f8fafc"/>
  <text x="440" y="28" text-anchor="middle" class="t">FHIR interoperability hub — request path</text>
  <rect x="30" y="55" width="130" height="50" rx="8" class="b"/>
  <text x="95" y="78" text-anchor="middle" class="l">SMART app</text>
  <text x="95" y="95" text-anchor="middle" class="l">Partner client</text>
  <line x1="160" y1="80" x2="200" y2="80" stroke="#334155" marker-end="url(#fh)"/>
  <rect x="200" y="55" width="140" height="50" rx="8" class="hi"/>
  <text x="270" y="78" text-anchor="middle" class="l">hub-api</text>
  <text x="270" y="95" text-anchor="middle" class="l">FHIR R4 JSON</text>
  <line x1="340" y1="80" x2="380" y2="80" stroke="#334155" marker-end="url(#fh)"/>
  <rect x="380" y="55" width="150" height="50" rx="8" class="b"/>
  <text x="455" y="85" text-anchor="middle" class="l">Auth · tenant scope</text>
  <line x1="530" y1="80" x2="570" y2="80" stroke="#334155" marker-end="url(#fh)"/>
  <rect x="570" y="55" width="140" height="50" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="640" y="78" text-anchor="middle" class="l">PostgreSQL</text>
  <text x="640" y="95" text-anchor="middle" class="l">FHIR resources</text>
  <line x1="710" y1="80" x2="750" y2="80" stroke="#334155" marker-end="url(#fh)"/>
  <rect x="750" y="55" width="100" height="50" rx="8" class="b"/>
  <text x="800" y="85" text-anchor="middle" class="l">Audit WORM</text>
  <rect x="80" y="140" width="720" height="55" rx="8" class="b"/>
  <text x="440" y="163" text-anchor="middle" class="l">GET /fhir/metadata (CapabilityStatement) · CRUD per resource type · search params (phased)</text>
  <text x="440" y="182" text-anchor="middle" class="l">Internal: /internal/v1 ingestion · OAuth (SMART) · usage metering · Prometheus /internal/metrics</text>
  <rect x="140" y="220" width="220" height="48" rx="8" class="b"/>
  <text x="250" y="250" text-anchor="middle" class="l">@fhir-hub/shared</text>
  <rect x="330" y="220" width="220" height="48" rx="8" class="b"/>
  <text x="440" y="250" text-anchor="middle" class="l">@fhir-hub/hub-client</text>
  <rect x="520" y="220" width="220" height="48" rx="8" class="b"/>
  <text x="630" y="250" text-anchor="middle" class="l">SQL migrations</text>
  <text x="440" y="310" text-anchor="middle" class="l">Adjunct to incumbent EHRs — data hub beachhead, not full EHR replacement</text>
</svg>